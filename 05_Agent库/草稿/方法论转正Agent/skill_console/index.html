<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Skill 收藏与接入</title><link rel="stylesheet" href="/style.css"><script defer src="/app.js"></script></head><body><header><div><span class="eyebrow">JASPER / SKILL LIBRARY</span><h1>Skill 收藏与接入</h1><p>素材在这里汇集，能力由你决定接入。</p></div><span id="connection">连接中</span></header><main><section class="intake"><h2>添加素材</h2><p>链接或图片保存到本机。我在聊天中完成分析后，结果会同步显示在下方。</p><form id="intake"><div class="columns"><label>GitHub 链接 · 每行一个<textarea id="links" rows="3" placeholder="https://github.com/作者/仓库"></textarea></label><div><label>图片素材 · 每张最多 8 MB<input id="images" type="file" accept="image/png,image/jpeg,image/webp" multiple></label><div id="paste" contenteditable="true" role="textbox" aria-label="截图粘贴区">点击这里粘贴截图</div><div id="files"></div></div></div><label>希望解决的问题<input id="note" placeholder="例如：整理研究资料，补充我的知识库"></label><button class="primary" id="save">保存素材</button><span id="message" role="status"></span></form></section><details class="queue" open><summary>素材收件箱 <span id="material-count"></span></summary><div id="materials"></div></details><section class="library"><aside><h2>收藏库</h2><label>分类<select id="category"><option>全部分类</option></select></label><label>状态<select id="status"><option>全部状态</option><option>备选</option><option>参考资料</option><option>已确认 · 待执行</option><option>已接入</option><option>接入失败</option></select></label><label>搜索<input id="search" placeholder="名称、用途、标签"></label><p id="count"></p><div id="list"></div></aside><article id="detail"><h2>等待第一份真实分析</h2><p>提交素材，或直接在聊天中发给我。这里不会用示例 Skill 填充你的收藏库。</p></article></section><details class="history"><summary>最近操作记录</summary><div id="events"></div></details></main><footer>本地存储 · 每 5 秒同步 · 收录不等于安装 · 接入确认固定到具体版本，由聊天中的 Codex 执行并验证。</footer><dialog id="confirm"><h2>确认接入</h2><div id="confirm-body"></div><p>确认后登记执行请求。请在聊天中让我执行，安装验证通过后才标记“已接入”。</p><button id="cancel">暂不接入</button><button id="approve" class="primary">确认这个版本</button><p id="confirm-error" role="alert"></p></dialog></body></html>
