acquisition_policy:
  discovery_sequence:
    - canonical_landing_page
    - section_page
    - period_detail_page
    - attachment_link
    - browser_session_download
  direct_attachment_guessing: prohibited
  source_snapshot_required: true
  checksum_required: true
  preserve_parent_page: true

completeness_assessment:
  can_be_primary_regulatory_backbone: true
  can_be_only_input_for_complete_industry_analysis: false
  strong_for:
    - official_market_size_and_structure
    - insurer_and_intermediary_universe
    - regulatory_events_and_reported_complaints
    - annual_and_quarterly_observed_metrics
  weak_or_missing_for:
    - customer_motivation
    - channel_operating_playbook
    - active_agent_productivity_and_retention
    - company_internal_execution
    - profit_value_and_capital_mechanism_at_required_granularity
  required_complements:
    - company_primary_disclosures
    - industry_media_and_expert_opinions
    - internal_experience_cards
    - customer_or_sales_research
    - macro_and_cross_border_data
