    scope: L10_L11_L18_company_details_to_market_totals_and_L6_cross_grain_controls
    semantic_exception: retirement_policy_count_and_lives_are_NA_while_scheme_count_is_available
    promotion_limit: one_year_only
  - test_id: TEST-HKIA-ANNUAL-LONG-L4-L16-001
