    semantic_exception: non_linked_participation_dimension_does_not_map_to_payment_basis
    promotion_limit: one_year_only
  - test_id: TEST-HKIA-ANNUAL-LONG-L1-L3-001
    result: pass_with_temporal_and_semantic_qualifications
    scope: five_observation_years_policy_exact_premium_rounding_liability_adjustment_and_sums_NA_boundary
    promotion_limit: one_report_vintage_only
  - test_id: TEST-HKIA-ANNUAL-LONG-L14-L16-001
    result: pass
    scope: 57_insurers_x_4_metrics_228_cells_zero_discrepancy
    promotion_limit: one_year_only
  - test_id: TEST-HKIA-ANNUAL-LONG-L8-L13-001
    result: pass_with_semantic_qualification
    scope: 57_insurers_x_5_validated_metric_formulas_zero_discrepancy
    semantic_exception: L13_policy_count_source_label_includes_L11_scheme_count
    promotion_limit: one_year_only
  - test_id: TEST-HKIA-ANNUAL-LONG-L16-L19-001
    result: pass
    scope: 57_insurers_x_4_metrics_228_cells_zero_discrepancy
