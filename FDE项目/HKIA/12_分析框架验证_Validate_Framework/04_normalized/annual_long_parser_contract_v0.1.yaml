contract_id: HKIA-ANNUAL-LONG-PARSER
version: 0.1
status: design_ready_first_reconciliation_test_passed
input_asset_set: ASTSET-IA-LTA-2024-FULL-XLSX
schema_registry: HKIA-ANNUAL-LONG-SCHEMA-REGISTRY
rule_registry: HKIA-ANNUAL-LONG-CROSS-YEAR-RULES

pipeline:
  - step: verify_file_signature_checksum_and_original_path
    failure: quarantine_asset
  - step: select_standard_or_legacy_excel_parser
    failure: create_incident
  - step: identify_table_id_sheet_and_report_year
    failure: reject_fact_extraction
  - step: select_year_specific_table_semantics_before_metric_mapping
    failure: quarantine_schema_version
  - step: detect_subtable_blocks_and_multilevel_headers
    failure: manual_schema_review
  - step: expand_merged_headers_and_normalize_bilingual_labels
    failure: retain_raw_header_path
  - step: map_payment_basis_and_quantity_metrics_from_labels_not_column_positions
    failure: quarantine_ambiguous_columns
  - step: convert_wide_observations_to_canonical_long_facts
    failure: no_partial_publish
  - step: normalize_units_metric_ids_dimensions_and_entity_ids
    failure: quality_flag_and_hold
  - step: separate_detail_market_total_NA_zero_and_blank_records
    failure: reconciliation_gate_fail
  - step: reconcile_detail_tables_to_control_tables
    failure: discrepancy_incident
  - step: emit_facts_lineage_and_quality_report
    failure: run_incomplete

outputs:
  - annual_long_market_facts
  - annual_long_termination_facts
  - annual_long_company_inforce_facts
  - annual_long_company_new_business_facts
  - annual_long_reconciliation_report
  - annual_long_parse_incidents

acceptance_tests:
  - all_19_tables_route_to_exactly_one_schema_family
  - all_numeric_records_have_metric_unit_period_and_locator
  - zero_blank_NA_and_not_disclosed_remain_distinct
  - company_rows_map_to_insurer_id_or_are_quarantined
  - market_total_is_not_double_counted
  - L14_plus_L15_reconciles_to_L16_by_insurer_and_metric_or_exception_is_logged
  - L16_L17_L18_to_L19_relation_is_reconciled_not_assumed
  - external_formula_header_artifacts_do_not_overwrite_source_file
  - L1_L2_L3_relations_are_validated_by_metric_and_observation_year_not_as_one_blanket_formula
  - L4_to_L14_L16_cross_grain_checks_normalize_units_and_compare_only_shared_dimensions
  - L6_group_policy_lives_and_retirement_scheme_counts_remain_separate_metric_types
  - L7_annuity_controls_apply_only_to_shared_business_categories_and_periods
  - L17_L18_L19_semantics_are_routed_by_report_year_not_table_number_alone
  - L8_L13_component_formulas_are_versioned_when_quantity_types_or_business_scope_change
  - L1_L3_market_history_reconciliation_includes_additional_reserve_rows_and_published_rounding_tolerance
  - overlapping_historical_values_are_compared_across_report_vintages_before_revision_flags_are_assigned
  - cross_grain_amount_reconciliation_uses_source_precision_metadata_and_accumulated_rounding_bounds
  - optional_control_branches_are_enabled_only_when_the_year_specific_L6_section_and_matching_company_table_semantics_exist
  - L7_annuity_controls_route_through_year_specific_business_titles_before_table_ids
  - L7_two_dimensional_blocks_map_linked_status_and_payment_basis_from_both_axes_before_aggregation

test_evidence:
  - test_id: TEST-HKIA-ANNUAL-LONG-2023-L7-COMPANY-001
    result: pass_with_year_specific_annuity_routing_and_precision_qualification
    scope: 59_company_entities_16_detail_controls_L7a_to_L12_and_L7b_to_L19
    stable_candidate: L7_to_year_routed_company_annuity_scope_validated_in_2023_and_2024
    schema_break: new_annuity_control_moves_from_L19_total_in_2023_to_L17_total_in_2024
  - test_id: TEST-HKIA-ANNUAL-LONG-2023-L6-COMPANY-001
    result: pass_with_schema_branch_and_mixed_precision_qualification
    scope: 59_company_entities_9_detail_controls_and_L6a_L6b_cross_grain_checks
    stable_candidate: L6_group_and_retirement_inforce_to_L10_L11_validated_in_2023_and_2024
    schema_break: L6c_and_group_new_business_L18_exist_in_2024_but_not_2023
  - test_id: TEST-HKIA-ANNUAL-LONG-2023-L4-L16-001
    result: pass_with_published_precision_qualification
    scope: 59_company_entities_12_detail_controls_and_L4_shared_grain_cross_unit_checks
    stable_candidate: L4_to_L14_L16_relation_validated_in_2023_and_2024
    precision_exception: 2023_L4_displays_0_1_million_while_company_tables_retain_thousand_precision
  - test_id: TEST-HKIA-ANNUAL-LONG-2023-L1-L3-001
    result: pass_with_rounding_and_adjustment_qualification
    scope: 2019_2023_five_year_market_history_and_16_cross_vintage_overlap_cells
    stable_candidate: metric_qualified_L1_L2_L3_relation_validated_in_2023_and_2024_report_vintages
    semantic_exception: net_liabilities_require_two_L1_additional_reserve_rows_and_linked_sums_assured_is_NA
  - test_id: TEST-HKIA-ANNUAL-LONG-2023-L8-L13-001
    result: pass_with_cross_year_metric_semantic_change
    scope: 59_entities_x_5_metric_formulas_295_cells_zero_discrepancy
    schema_break: L11_policy_and_lives_change_to_scheme_count_and_payment_column_order_reverses
  - test_id: TEST-HKIA-ANNUAL-LONG-2023-CROSS-YEAR-001
    result: pass_with_schema_version_break
    scope: 59_entities_x_4_metrics_for_two_company_control_chains
    stable_candidate: L14_plus_L15_equals_L16_validated_in_2023_and_2024
    schema_break: L18_L19_business_meanings_change_between_2023_and_2024
  - test_id: TEST-HKIA-ANNUAL-LONG-L7-COMPANY-001
    result: pass_with_period_scope_qualification
    scope: L12_L17_company_details_to_market_totals_and_L7_2024_shared_annuity_grain
    semantic_exception: L7a_other_categories_have_no_L12_counterpart_and_are_NA_in_2024
    promotion_limit: one_year_only
  - test_id: TEST-HKIA-ANNUAL-LONG-L6-COMPANY-001
