incidents:
  - incident_id: INC-PB-004
    run_id: RUN-HKIA-PHASE-B-SLICE-01
    incident_class: file_format
    detected_at_step: PB01-STEP-017
    impact: 标准XLSX解析器误判两个官方文件损坏
    root_cause: IA下载文件扩展名为xlsx但实际是OLE旧版Excel
    correction: 保留原始文件_按文件签名路由_只读副本转换后成功解析
    prevention_candidate:
      type: parser_rule_candidate
      rule: 选择解析器前检查文件签名_不得只依赖扩展名
      status: candidate_1_of_3
  - incident_id: INC-PB-001
    run_id: RUN-HKIA-PHASE-B-SLICE-01
    incident_class: access
    detected_at_step: PB01-STEP-002
    impact: L5原始PDF未能落库，T02候选事实不能转正
    root_cause: IA官网对机器直连返回403，页面会话进入Cloudflare检查
    correction: 保留来源定位和失败日志，不伪造Asset；转向版本匹配的data.gov.hk资源或人工下载
    resolution: 从IA统计入口进入年份详情页后，通过页面会话下载官方XLSX；两次文件校验和一致
    prevention_candidate:
      type: workflow_rule_candidate
      rule: 公开来源的搜索摘要不得替代原始Asset进入正式Fact
      status: candidate_1_of_3
  - incident_id: INC-PB-002
    run_id: RUN-HKIA-PHASE-B-SLICE-01
    incident_class: scope
    detected_at_step: PB01-STEP-001
    impact: 若仅审计季度Excel，会错误把T14判断为完全缺失
    root_cause: 将单一数据产品的字段覆盖误当成发布机构的整体信息覆盖
    correction: 新增季度新闻稿Source并把T14校正为weak_partial，同时保持独立证据链
    prevention_candidate:
      type: workflow_rule_candidate
      rule: Theme缺口判定必须至少区分数据表、新闻稿和监管文件三类发布载体
      status: candidate_1_of_3
  - incident_id: INC-PB-003
    run_id: RUN-HKIA-PHASE-B-SLICE-01
    incident_class: access
    detected_at_step: PB01-STEP-006
    impact: 可以发现公众号文章元数据，但不能保存和核验原文
    root_cause: 微信原文在当前运行环境中受到站点访问策略限制
    correction: 仅登记Source Lead；等待用户提供URL_导出件_截图或全文后再做内容抽取
    prevention_candidate:
      type: workflow_rule_candidate
      rule: 公众号搜索摘要和标题不得替代原文Asset；营销比例无样本与分母不得进入Fact
      status: candidate_1_of_3

