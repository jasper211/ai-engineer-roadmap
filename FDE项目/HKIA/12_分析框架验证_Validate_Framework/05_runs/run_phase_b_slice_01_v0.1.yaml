incidents:
  - incident_id: INC-PB-008
    run_id: RUN-HKIA-PHASE-B-SLICE-01
    incident_class: parser_nested_header
    detected_at_step: PB01-STEP-040
    impact: 首次L6b试算读取2022总数右侧空列_造成与L11整列等额的假残差
    root_cause: 退休计划区各年度列组宽度与团体区不同_按固定列位映射失败
    correction: 同时解析年份表头与其下Total标签_复算后全部控制通过
    prevention_candidate:
      type: parser_rule_candidate
      rule: 跨分区表不得继承固定列组宽度_每个分区独立解析嵌套表头
      status: candidate_1_of_3
  - incident_id: INC-PB-007
    run_id: RUN-HKIA-PHASE-B-SLICE-01
    incident_class: source_internal_reconciliation
    detected_at_step: PB01-STEP-039
    impact: 2022年L4保费不能在已证明的展示舍入范围内与L14_L16及L1闭环_RULE_LT_002不能晋升
    root_cause: unresolved_official_cross_table_difference_L4_higher_than_L1_and_company_tables_by_about_0_6_HKD_million
    correction: 保留各官方值和差异_不扩大容差_计数与相连业务继续标记通过_金额总额保持例外
    prevention_candidate:
      type: quality_gate_rule_candidate
      rule: 相对差异很小不等于规则通过_超过可证明精度边界必须登记来源例外并暂停晋升
      status: candidate_1_of_3
  - incident_id: INC-PB-006
    run_id: RUN-HKIA-PHASE-B-SLICE-01
    incident_class: parser_row_addressing
    detected_at_step: PB01-STEP-038
    impact: 首次试算把L1业务分类行误当总数及额外储备行_产生不合理巨额残差
    root_cause: 解析器忽略UsedRange从A2起始_将数组索引当作绝对工作表行号
    correction: 改为按双语标签定位章节总数调整行_再用年份表头和数量级复核
    prevention_candidate:
      type: parser_rule_candidate
      rule: 不得用UsedRange数组索引硬编码工作表行_必须解析range起点或按标签定位
      status: candidate_1_of_3
  - incident_id: INC-PB-005
    run_id: RUN-HKIA-PHASE-B-SLICE-01
    incident_class: source_content_mismatch
    detected_at_step: PB01-STEP-035
    impact: 官网标示的2022长期业务保险公司名单不能用于公司身份连接或完整包声明
    root_cause: 官方Insurerlist_2022链接返回的工作簿实际为2020年一般保险临时统计
    correction: 保留原始字节和哈希_逻辑隔离该文件_其余21份表可继续做算术与Schema控制
    prevention_candidate:
      type: asset_gate_rule_candidate
      rule: 每个下载件必须核对内部标题年份业务类型_文件名和官网链接文字不能替代内容校验
      status: candidate_1_of_3
  - incident_id: INC-PB-004
    run_id: RUN-HKIA-PHASE-B-SLICE-01
    incident_class: file_format
    detected_at_step: PB01-STEP-017
    impact: 标准XLSX解析器误判两个官方文件损坏
    root_cause: IA下载文件扩展名为xlsx但实际是OLE旧版Excel
    correction: 保留原始文件_按文件签名路由_只读副本转换后成功解析
    prevention_candidate:
      type: parser_rule_candidate
      rule: 选择解析器前检查文件签名_不得只依赖扩展名
      status: candidate_1_of_3
  - incident_id: INC-PB-001
    run_id: RUN-HKIA-PHASE-B-SLICE-01
    incident_class: access
    detected_at_step: PB01-STEP-002
    impact: L5原始PDF未能落库，T02候选事实不能转正
    root_cause: IA官网对机器直连返回403，页面会话进入Cloudflare检查
    correction: 保留来源定位和失败日志，不伪造Asset；转向版本匹配的data.gov.hk资源或人工下载
    resolution: 从IA统计入口进入年份详情页后，通过页面会话下载官方XLSX；两次文件校验和一致
    prevention_candidate:
      type: workflow_rule_candidate
      rule: 公开来源的搜索摘要不得替代原始Asset进入正式Fact
      status: candidate_1_of_3
  - incident_id: INC-PB-002
    run_id: RUN-HKIA-PHASE-B-SLICE-01
    incident_class: scope
    detected_at_step: PB01-STEP-001
    impact: 若仅审计季度Excel，会错误把T14判断为完全缺失
    root_cause: 将单一数据产品的字段覆盖误当成发布机构的整体信息覆盖
    correction: 新增季度新闻稿Source并把T14校正为weak_partial，同时保持独立证据链
    prevention_candidate:
      type: workflow_rule_candidate
      rule: Theme缺口判定必须至少区分数据表、新闻稿和监管文件三类发布载体
      status: candidate_1_of_3
  - incident_id: INC-PB-003
    run_id: RUN-HKIA-PHASE-B-SLICE-01
    incident_class: access
    detected_at_step: PB01-STEP-006
    impact: 可以发现公众号文章元数据，但不能保存和核验原文
    root_cause: 微信原文在当前运行环境中受到站点访问策略限制
    correction: 仅登记Source Lead；等待用户提供URL_导出件_截图或全文后再做内容抽取
    prevention_candidate:
      type: workflow_rule_candidate
      rule: 公众号搜索摘要和标题不得替代原文Asset；营销比例无样本与分母不得进入Fact
      status: candidate_1_of_3

