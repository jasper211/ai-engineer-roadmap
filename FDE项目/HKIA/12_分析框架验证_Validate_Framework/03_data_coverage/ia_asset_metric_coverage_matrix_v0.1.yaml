  observed_as_of: 2026-06-30
  data_subjects:
    - appointed_and_unappointed_individual_licensees
    - individual_agents_agency_representatives_and_broker_representatives
    - licensed_agencies_and_broker_companies
    - licensees_by_eligible_line_of_business
  themes: [T22]
  evidence_permission: licensed_population_size_only
  prohibited_inference: cannot_infer_active_rate_productivity_or_retention

