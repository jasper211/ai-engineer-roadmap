representative_quarterly_workbook:
  file: 1q26_long.xlsx
  period: 2026Q1
  sheet_count: 17
  sheets:
    - {name: Form LT QR (NB), subject: new_business_by_product, themes: [T00, T01, T10]}
    - {name: Form LT QR (CCY), subject: new_business_by_currency, themes: [T13]}
    - {name: Form LT QR (prem term), subject: new_business_by_premium_term, themes: [T11]}
    - {name: Form LT QR (channel), subject: new_business_by_distribution_channel, themes: [T12]}
    - {name: Form LT QR (IF), subject: inforce_business_and_premiums_receivable, themes: [T02]}
    - {name: Form LT QR (IF G H), subject: inforce_group_and_other_classes, themes: [T02]}
    - {name: Form LT QR (Lapse), subject: lapse_or_termination, themes: [T02]}
    - {name: Form LT QR (RI), subject: reinsurance, themes: [T32]}
    - {name: Table L1, subject: insurer_new_business, themes: [T20]}
    - {name: Table L2, subject: insurer_inforce_business, themes: [T20, T02]}
    - {name: Table L1 (CCY), subject: insurer_new_business_by_currency, themes: [T20, T13]}
    - {name: Table L1 (prem term), subject: insurer_new_business_by_premium_term, themes: [T20, T11]}
    - {name: Table L1 (channel), subject: insurer_new_business_by_channel, themes: [T20, T12]}
    - {name: Table L3, subject: insurer_business_detail, themes: [T20, T21]}
    - {name: Table L4, subject: insurer_business_detail, themes: [T20, T21]}
    - {name: List of Insurers, subject: insurer_entity_reference, themes: [T20]}
    - {name: notes, subject: definitions_and_notes, themes: []}

confirmed_metric_families:
  - {family: business_volume, metrics: [policy_count, lives, sums_assured, single_premium, annualized_premium], dimensions: [period, product, participating_status]}
  - {family: currency, metrics: [policy_count, single_premium, annualized_premium], dimensions: [HKD, RMB, USD, other_currency, product]}
  - {family: premium_term, metrics: [policy_count, single_premium, annualized_premium], dimensions: [single, under_5_years, 5_to_under_10, 10_to_under_25, 25_plus, product]}
  - {family: channel, metrics: [policy_count, single_premium, annualized_premium], dimensions: [agent_ex_bancassurance, bancassurance, broker, direct_sales, other, product]}
  - {family: inforce, metrics: [policy_count, lives, sums_assured, single_premium, first_year_premium, renewal_premium], dimensions: [product, participating_status]}
  - {family: insurer, metrics: [new_business, inforce_business], dimensions: [insurer, product, channel, currency, premium_term]}
  - {family: lapse_and_termination, metrics: [lapse_or_termination_observations], dimensions: [product_and_table_specific_dimensions]}
  - {family: reinsurance, metrics: [reinsurance_observations], dimensions: [table_specific_dimensions]}

annual_l5_2024:
  subject: individual_life_voluntary_termination_rate
  historical_overall_rate_period: 2020_2024
  dimensions: [linked_status, insurance_type, policy_year, participating_status]
  metrics: [overall_termination_rate, first_policy_year_rate, second_policy_year_rate, third_year_and_after_rate]
  limitation: some_product_rows_are_NA_for_2024_breakdown

intermediary_licensing_web_table:
