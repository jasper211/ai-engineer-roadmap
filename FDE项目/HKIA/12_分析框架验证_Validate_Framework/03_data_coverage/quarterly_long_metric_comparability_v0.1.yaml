matrix_id: HKIA-LTQ-METRIC-COMPARABILITY-2023Q1-2026Q1
version: 0.1
status: core_market_total_layer_mapped
source_manifest: HKIA-LTQ-2023Q1-2026Q1

schema_break:
  boundary: 2025Q1
  before:
    periods: [2023Q1, 2024Q1]
    individual_axis: [non_linked_class_A, linked_class_C, other_classes_B_D_E_F]
    inforce_layout: [Table_L3_1, Table_L3_2]
  after:
    periods: [2025Q1, 2025Q4, 2026Q1]
    individual_axis: [participating, other_excluding_group, linked_class_C]
    inforce_layout: [Table_L3]
  interpretation: 分类明细不可因列位相近而直接串联_市场总额可按共同业务范围桥接

