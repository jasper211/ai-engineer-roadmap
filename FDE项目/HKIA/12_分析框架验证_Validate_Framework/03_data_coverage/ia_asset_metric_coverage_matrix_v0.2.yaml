    - complaint_statistics_latest_pdf_and_Conduct_in_Focus_12
    - intermediary_dynamics_issue_12
  P1:
    - general_business_2024_market_and_company_xlsx
    - general_business_2025Q4_xlsx
    - historical_MCV_press_release_asset_index
  P2:
    - broker_and_agency_survey_pdfs
    - general_business_historical_backfill

remaining_core_gaps:
