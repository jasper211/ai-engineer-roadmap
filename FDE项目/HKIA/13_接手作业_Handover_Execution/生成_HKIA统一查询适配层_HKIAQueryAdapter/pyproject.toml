[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hkia-query-adapter"
version = "1.0.0"
description = "HKIA 香港保险数据统一查询适配层（只读、白名单语义查询、口径门禁）"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[tool.setuptools.packages.find]
include = ["hkia_adapter*"]

[tool.setuptools.package-data]
"hkia_adapter" = ["_assets/config/*.json", "_assets/schema/*.json", "_assets/bridge/*.csv"]

[tool.setuptools]
include-package-data = true
