claims:
  - claim_id: C-T12-001
    theme_id: T12
    claim_type: comparative
    statement: 2019至2025年代理渠道的NOP相对市场位置下降
    scope:
      start: 2019-FY
      end: 2025-FY
      object_scope: HK_new_long_term_business
      measure: NOP
    baseline_contract_id: CONTRACT-HKIA-CHANNEL-001
    grade: A
    status: supported_A
    alternative_explanations: []
    falsification_conditions:
      - 发现份额分母跨期不一致
      - 发现渠道映射变化足以改变方向
      - 2024表式断点导致份额序列不可比
    unresolved_conflicts: []
    allowed_surfaces: [chart_insight, page_title, synthesis]
    owner: Jasper
    reviewer: pending
    version: 1
  - claim_id: C-T12-002
    theme_id: T12
    claim_type: mechanism
    statement: 开放渠道更有效承接配置型需求，是代理相对份额下降的机制之一
    scope:
      start: 2019-FY
      end: 2025-FY
      object_scope: HK_new_long_term_business
    baseline_contract_id: CONTRACT-HKIA-CHANNEL-001
    grade: C
    status: blocked_C
    alternative_explanations:
      - 代理渠道自身供给或产能变化
      - 公司产品和渠道策略变化
      - 客群与跨境流量变化
    falsification_conditions:
      - 平行结构证据不支持配置型特征
      - 客户或销售证据显示原因与渠道开放度无关
    unresolved_conflicts: []
    evidence_needed:
      - T10/T11/T13平行结构证据
      - 公司渠道策略披露
      - 客户或销售流程证据
    allowed_surfaces: [research_question, appendix_gap]
    owner: Jasper
    reviewer: pending
    version: 1

