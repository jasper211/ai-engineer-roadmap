formulas:
  - formula_id: FRM-NOP
    expression: annualized_premium + single_premium
    unit: HKD_thousand
  - formula_id: FRM-APE
    expression: annualized_premium + 0.1 * single_premium
    unit: HKD_thousand
  - formula_id: FRM-SHARE
    expression: segment_measure / same_scope_market_measure
    unit: ratio

