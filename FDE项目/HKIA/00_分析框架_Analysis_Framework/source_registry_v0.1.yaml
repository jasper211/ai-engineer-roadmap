registry_id: HKIA-SOURCE-REGISTRY
version: 0.1
status: draft

source_classes:
  S1_regulatory_government:
    default_permissions: [fact, regulatory_event]
    default_proximity: primary
  S2_company_primary:
    default_permissions: [company_fact, company_claim]
    default_proximity: primary_for_company
  S3_research_database:
    default_permissions: [research_fact, research_claim]
    default_proximity: mixed
  S4_industry_media:
    default_permissions: [media_claim, source_lead]
    default_proximity: secondary
  S5_expert_social:
    default_permissions: [expert_opinion, source_lead]
    default_proximity: primary_opinion
  S6_internal_experience:
    default_permissions: [experience, routing_rule_candidate]
    default_proximity: internal
  S7_user_supplied:
