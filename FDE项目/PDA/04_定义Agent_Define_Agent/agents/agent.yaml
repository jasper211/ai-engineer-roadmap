agent_id: PDA
name: 业绩数据多维分析 Agent（围绕牌照端 issuing_entity）
version: 0.10.0
status: 测试中
entrypoint: agent.py
capabilities:
  - load_raw_performance_excel_with_completeness_check  # 读取raw_data/底表xlsx，剔除表头残留行，校验30列齐全
  - clean_and_standardize  # 日期类型修正(Excel序列号)、policy_status三档映射、future_dated标记
  - aggregate_by_issuing_entity  # 围绕issuing_entity的7类多维聚合，对齐阶段一原型DATA结构
  - generate_html_dashboard  # 复用阶段一原型的Chart.js模板注入修正后数据
  - enrich_report_derived_fields  # 反推还原S8_明细数据底表13个衍生字段，用真实S8 sheet逐行核验
  - sync_target_ape  # 只读同步服务器fact_target目标APE数据（tools/fact_target_sync.py）
  - build_s1_dashboard  # 反推还原S1_总览仪表盘A-H全部8个板块，用真实报表逐项核验
  - build_s2_business_view  # 反推还原S2_业务端视角核心板块(A/B/C-H/I/J/K/O)，用真实报表逐项核验
  - build_s3_execution_view  # 反推还原S3_执行管理端核心板块(A/B/C/D/G/H)，含周度趋势(%YW%U周定义)+签批时效分析
  - build_s4_product_view  # 反推还原S4_产品端视角全部5个板块(A/B/C/D/E)，含carrier简称映射+产品TOP20联合主键分组
  - build_s5_finance_view  # 反推还原S5_财务端视角全部8个板块(A/B/C/D/E/F/G/H)，含规模分档+大额保单TOP20(并列tie-break)
  - build_s6_market_cross_view  # 反推还原S6_市场与交叉视角全部12张子表，纯交叉透视复用S2/S4既有组件
  - build_s7_compliance_view  # 反推还原S7_合规端视角全部6个板块(A/B-D×APE/件数/E/F)，含distinct计数并集范围+8字截断规则+折算distinct规则
  - build_s9_agent_ka_view  # 反推还原S9_代理人与KA业务全部10个顶层板块(A-J，H/I/J各6张周度子表)，最后1张专题视角表
boundaries:
  included: 单份底表Excel的一次性清洗+聚合+看板生成demo；修复真实核实发现的日期类型bug和future_dated计数bug；S8明细底表13个衍生字段（12个已100%核验，1个待补标准化规则）；S1_总览仪表盘A-H全部8个板块（100%核验）；S2_业务端视角核心12个子板块（A/B/C/I/J/K/O已核验，D-H同规则推算）；S3_执行管理端核心6个子板块（100%核验）；S4_产品端视角全部5个板块（100%核验）；S5_财务端视角全部8个板块（核心5个100%核验，B/C月度趋势同规则推算）；S6_市场与交叉视角全部12张子表（A-D已核验，E/F同规则推算）；S7_合规端视角全部6个板块（核心A/B/E/F已100%核验，C/D同规则推算）；S9_代理人与KA业务全部10个顶层板块（核心A/B/D/F-ICLUB/G/H已核验，C/E/F-其余/I/J同规则推算）
  deferred: CRM/保司系统实时同步、多用户权限、知识库问答（阶段二/三，前提未确认）、sum_assured/referral_code字段的清洗与聚合（当前维度框架未用到）、S2的S/T板块（partner_code维度）、S3的E/F(未批核待签透视表)+J-O(同行/银行周度趋势)、PPT生成（PPT生成代码Jasper已提供但是报表→PPT阶段，不含raw→报表阶段）——9张专题视角表全部反推完成
